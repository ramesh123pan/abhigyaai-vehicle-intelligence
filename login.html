<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign In | Vehicle Desk</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f4f7fb;color:#17233d;font:14px system-ui}form{width:min(360px,80vw);background:white;padding:32px;border:1px solid #dce5f1;border-radius:16px;box-shadow:0 10px 35px #17233d10}label{display:block;margin:18px 0}input{display:block;box-sizing:border-box;width:100%;margin-top:7px;padding:12px;border:1px solid #cfd8e6;border-radius:7px}button{padding:12px;width:100%;border:0;border-radius:7px;background:#2563eb;color:white;cursor:pointer}#error{color:#b91c1c}p{line-height:1.5}</style><script src="/login.js" defer></script></head><body><form id="signIn"><h1>Vehicle Desk</h1><p>Sign in to your workspace.</p><label>Email<input name="email" type="email" autocomplete="username" required></label><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button>Sign In</button><p id="error" role="alert"></p></form></body></html>
